[project]
name = "arc-prize-2026"
version = "0.1.0"
description = "ARC Prize 2026 Paper Track entry by Dam Solanke"
readme = "README.md"
license = {text = "MIT-0"}
requires-python = ">=3.11"
authors = [{name = "Dam Solanke"}]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "scipy>=1.13",
]

[project.optional-dependencies]
torch = [
    "torch>=2.5",
    "accelerate>=0.34",
]
trm = [
    "tiny-recursive-model",
]
dev = [
    "pytest>=8",
    "ruff>=0.5,<0.16",
    "mypy>=1.10",
]
paper = [
    "jupyter",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
